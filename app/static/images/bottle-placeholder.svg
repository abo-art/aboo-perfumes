<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e29a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>

    <!-- Glass Flacon Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="40%" stop-color="rgba(30, 36, 50, 0.65)" />
      <stop offset="100%" stop-color="rgba(15, 18, 25, 0.95)" />
    </linearGradient>

    <!-- Liquid Amber Glow -->
    <radialGradient id="liquidGlow" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0.35)" />
      <stop offset="70%" stop-color="rgba(212, 175, 55, 0.08)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Filter Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambience -->
  <rect x="0" y="0" width="200" height="260" rx="16" fill="transparent" />
  
  <!-- Flacon Cap -->
  <rect x="78" y="24" width="44" height="26" rx="4" fill="url(#goldGrad)" filter="url(#glow)" />
  <rect x="78" y="24" width="44" height="26" rx="4" fill="url(#goldGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  
  <!-- Neck Collar -->
  <rect x="88" y="50" width="24" height="12" fill="#d4af37" />
  <line x1="88" y1="56" x2="112" y2="56" stroke="rgba(0,0,0,0.5)" stroke-width="1.5" />

  <!-- Bottle Body (Glass Flacon) -->
  <rect x="42" y="62" width="116" height="165" rx="12" fill="url(#glassGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Liquid Glow inside bottle -->
  <rect x="48" y="95" width="104" height="126" rx="8" fill="url(#liquidGlow)" />
  
  <!-- Glass Highlight Reflections -->
  <path d="M 52 74 L 52 215" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" stroke-linecap="round" />
  <path d="M 58 78 L 58 135" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" stroke-linecap="round" />
  
  <!-- Gold Label Crest -->
  <rect x="62" y="110" width="76" height="58" rx="6" fill="rgba(10, 12, 16, 0.85)" stroke="url(#goldGrad)" stroke-width="1" />
  <circle cx="100" cy="128" r="9" fill="url(#goldGrad)" />
  <text x="100" y="132" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="#12161f" text-anchor="middle">✦</text>
  <text x="100" y="152" font-family="'Outfit', sans-serif" font-size="8" letter-spacing="2" font-weight="600" fill="#d4af37" text-anchor="middle">ABOO</text>
  <text x="100" y="161" font-family="'Outfit', sans-serif" font-size="6" letter-spacing="1.5" fill="#a0aec0" text-anchor="middle">PARFUMS</text>
</svg>
